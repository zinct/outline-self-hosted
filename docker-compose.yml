services:
  outline:
    image: outlinewiki/outline:latest
    container_name: outline
    env_file: .env
    ports:
      - "${OUTLINE_PORT:-3000}:3000"
    volumes:
      - outline-data:/var/lib/outline/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pocket-id:
        condition: service_healthy
    restart: unless-stopped

  pocket-id:
    image: pocketid/pocket-id:v2
    container_name: pocket-id
    ports:
      - "${POCKETID_PORT:-1411}:1411"
    environment:
      APP_URL: ${POCKETID_APP_URL:-http://localhost:1411}
      INTERNAL_APP_URL: ${POCKETID_INTERNAL_APP_URL:-http://pocket-id:1411}
      ENCRYPTION_KEY: ${POCKETID_ENCRYPTION_KEY}
      TRUST_PROXY: ${POCKETID_TRUST_PROXY:-false}
      ALLOW_INSECURE_CALLBACK_URLS: ${POCKETID_ALLOW_INSECURE_CALLBACK_URLS:-true}
    volumes:
      - pocket-id-data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: outline-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: outline-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  outline-data:
  pocket-id-data:
  postgres-data:
  redis-data:
